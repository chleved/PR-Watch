[Rainmeter]
Update=1000
OnRefreshAction=[!CommandMeasure "MFetch" "Run"]

[Metadata]
Name=PR Watch Updater
Information=Runs the fetcher on a timer and refreshes the Widget skin when it finishes. Has no visible window.
Version=1.0

[Variables]
; seconds between fetches (the skin updates once a second, so this is the UpdateDivider)
IntervalSeconds=900
; use py if python is not on PATH
PythonCmd=python
WidgetConfig=PRWidget\Widget

[MTimer]
Measure=Calc
Formula=1
UpdateDivider=#IntervalSeconds#
OnUpdateAction=[!CommandMeasure "MFetch" "Run"]

[MFetch]
Measure=Plugin
Plugin=RunCommand
Parameter=#PythonCmd# "#@#fetcher\fetch_prs.py"
State=Hide
OutputType=ANSI
OutputFile=#@#fetcher\data\last_run.txt
Timeout=300000
FinishAction=[!Refresh "#WidgetConfig#"]

; Rainmeter refuses to load a skin with no meters, so this is an empty placeholder.
[MeterDummy]
Meter=String
Text=
W=1
H=1