[Rainmeter]
Update=1000
AccurateText=1
ContextTitle=Fetch now
ContextAction=[!CommandMeasure "MFetch" "Run" "#UpdaterConfig#"]
ContextTitle2=Edit PR list
ContextAction2=["#@#fetcher\prs.txt"]

[Metadata]
Name=PR Watch
Information=Status of a list of GitHub pull requests. Generated by tools/make_skin.py
Version=1.1

[Variables]
Rows=8
Step=1
UpdaterConfig=PRWidget\Updater
FontMono=Consolas
FontSans=Segoe UI
@Include=#@#fetcher\data\prs.inc
@Include2=#@#state.inc

[MOffMax]
Measure=Calc
Formula=Max(0,#Count#-#Rows#)

[MOffset]
Measure=Calc
Formula=Clamp(#Offset#,0,MOffMax)
DynamicVariables=1

[MOffUp]
Measure=Calc
Formula=Clamp(#Offset#-#Step#,0,MOffMax)
DynamicVariables=1

[MOffDown]
Measure=Calc
Formula=Clamp(#Offset#+#Step#,0,MOffMax)
DynamicVariables=1

[MShown]
Measure=Calc
Formula=Clamp(#Count#,0,#Rows#)

[MPanelH]
Measure=Calc
Formula=12+MShown*72

[MPanelIn]
Measure=Calc
Formula=MPanelH-2

[MPanelHide]
Measure=Calc
Formula=(#Count# <= 0) ? 1 : 0
IfCondition=#Count# <= 0
IfTrueAction=[!Hide]
IfFalseAction=[!Show]

[MNow]
Measure=Time
Format=%s

[MIdx1]
Measure=Calc
Formula=MOffset+1

[MH1]
Measure=Calc
Formula=(MIdx1 > #Count#) ? 1 : 0

[MHI1]
Measure=Calc
Formula=((MH1 + [#IconHide[&MIdx1:0]]) > 0) ? 1 : 0
DynamicVariables=1

[MHP1]
Measure=Calc
Formula=((MH1 + [#PrHide[&MIdx1:0]]) > 0) ? 1 : 0
DynamicVariables=1

[MHA1]
Measure=Calc
Formula=((MH1 + [#AgeHide[&MIdx1:0]]) > 0) ? 1 : 0
DynamicVariables=1

[MC1]
Measure=Calc
Formula=[#Chip[&MIdx1:0]] * 36
DynamicVariables=1

[MM1]
Measure=Calc
Formula=[#Chip[&MIdx1:0]] * 255
DynamicVariables=1

